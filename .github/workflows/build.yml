name: Build app

# Builds the double-click Science Inventory program for Windows, macOS and Linux.
# Download the results from the run's "Artifacts" section. Pushing a tag such as
# v1.0.0 also publishes them on the repository's Releases page.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
          - os: macos-latest
            label: mac-apple-silicon
          - os: ubuntu-latest
            label: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller pytest

      - name: Run tests
        run: python -m pytest -q

      - name: Build
        run: pyinstaller --noconfirm ScienceInventory.spec

      - name: Check the built program starts
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then ./dist/ScienceInventory.exe --selftest; else ./dist/ScienceInventory --selftest; fi

      - name: Package
        run: |
          mkdir out
          case "$RUNNER_OS" in
            Windows) cp dist/ScienceInventory.exe out/ScienceInventory.exe ;;
            # Zip so the "executable" permission survives the download.
            macOS)   ditto -c -k --keepParent dist/ScienceInventory out/ScienceInventory-mac.zip ;;
            Linux)   (cd dist && zip -q ../out/ScienceInventory-linux.zip ScienceInventory) ;;
          esac
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: ScienceInventory-${{ matrix.label }}
          path: out/*
          retention-days: 90

  # Checks the "run from source" start scripts work on a machine with only Python installed.
  start-scripts:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      INVENTORY_NO_BROWSER: "1"
      INVENTORY_PORT: "5071"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Start the app with its start script
        run: |
          case "$RUNNER_OS" in
            Windows) cmd //c "Start Science Inventory.bat" > start.log 2>&1 < /dev/null & ;;
            macOS)   "./Start Science Inventory.command" > start.log 2>&1 < /dev/null & ;;
            Linux)   ./start.sh > start.log 2>&1 < /dev/null & ;;
          esac
          for i in $(seq 1 180); do
            if curl -sf -o /dev/null http://127.0.0.1:5071/; then
              echo "App answered after ${i}s"; cat start.log; exit 0
            fi
            sleep 1
          done
          echo "App did not start:"; cat start.log; exit 1

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Name files per platform
        run: |
          mkdir release
          cp artifacts/ScienceInventory-windows/ScienceInventory.exe release/ScienceInventory-windows.exe
          cp artifacts/ScienceInventory-mac-apple-silicon/ScienceInventory-mac.zip release/
          cp artifacts/ScienceInventory-linux/ScienceInventory-linux.zip release/
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
